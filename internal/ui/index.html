<style>

table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.sp{flex:1}

.panel.edit{outline:1px dashed var(--line)}.panel.edit header{cursor:grab}.panel.over{outline:2px solid var(--acc)}
.panel header button{background:none;border:0;color:var(--mut);cursor:pointer;padding:2px 5px;border-radius:5px}.panel header button:hover{background:var(--acc2);color:var(--fg)}

.chart{position:relative}.chart svg{display:block;width:100%}.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:4px}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:380px;padding:26px}

.login input{width:100%;margin-bottom:10px}
.dot.bad{background:var(--err)}
.stat .v.ok{color:var(--ok)}.stat .v.err{color:var(--err)}.stat .v.mut{color:var(--mut)}.stat .names{white-space:pre-line;font-size:12px;margin-top:4px;color:var(--mut);max-width:280px;line-height:1.35}.stat.click{cursor:pointer}

.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);margin:2px 4px 2px 0;cursor:pointer;background:var(--panel)}.chip:hover{border-color:var(--acc);background:var(--acc2)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}

.errbox{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;margin-bottom:12px}[data-theme=dark] .errbox{background:#3b1414;color:#fecaca;border-color:#7f1d1d}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}

[data-theme=dark] .badge.up{background:#14532d;color:#bbf7d0}[data-theme=dark] .badge.down{background:#7f1d1d;color:#fecaca}[data-theme=dark] .badge.pending{background:#78350f;color:#fde68a}
.help{color:var(--mut);font-size:12px;margin:4px 0 0}
.badge.info{background:#e0e7ff;color:#3730a3}[data-theme=dark] .badge.info{background:#312e81;color:#c7d2fe}
#side nav a .nb{margin-left:auto;background:var(--err);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px;min-width:18px;text-align:center}.warn{color:#b45309}[data-theme=dark] .warn{color:#fbbf24}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';

for(const m of ['replaceChildren','append']){const orig=Element.prototype[m];Element.prototype[m]=function(...k){return orig.apply(this,k.flat(Infinity).filter(x=>x!=null&&x!==false))}}

const store={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const uid=()=>Math.random().toString(36).slice(2,9);
const RANGES={'15m':9e5,'1h':36e5,'6h':216e5,'24h':864e5,'7d':6048e5,'30d':2592e6};
const S={me:null,range:store.get('lumen.range','1h'),refresh:+store.get('lumen.refresh','0'),timers:[],archive:store.get('lumen.archive','0')==='1',custom:null};
try{S.custom=JSON.parse(store.get('lumen.custom','null'))}catch{}
if(!RANGES[S.range]&&!(S.range==='custom'&&S.custom))S.range='1h';
// what the signed-in user may do: area -> none|read|write (from /api/v1/me)
S.brand={name:'',has_logo:false,version:''};S.hn={};
const hostLabel=n=>S.hn[n]||n;
// An agent built from the same source as the server has the same version string; a different one means it should be updated.
const agentOld=v=>!!(S.me&&S.me.version&&S.me.version!=='dev'&&v&&v!==S.me.version);
// The label next to an agent whose version differs from the server's: one click updates it (when the agent can do that),
// otherwise it explains how. h is the host as the API gives it; after() redraws the page.
function updateChip(h,after){
  if(!agentOld(h.version))return null;
  const w=can('hosts',true),secs=h.update_requested?Date.now()/1000-h.update_requested:Infinity,asked=secs<7200,mins=Math.floor(secs/60);
  const plain='This agent ('+h.version+') is not the version of this server ('+S.me.version+').';
  if(asked&&mins<10)return el('span',{class:'pill info',title:'The update was asked for '+(mins<1?'a moment':mins+' min')+' ago. The agent picks it up within a minute, installs it and restarts.'},'updating…');
  if(asked)return el('span',{class:'pill err',style:w?'cursor:pointer':'',title:'Asked '+mins+' minutes ago, and the agent still has '+h.version+'. On the machine, look at: journalctl -u lumen-agent-update (an agent installed with the script), or docker logs (a container). '+(w?'Click to try again.':''),onclick:w?ev=>{ev.stopPropagation();updateFailedDialog(h,after,mins)}:null},'update failed?');

// the by-hand commands, the same for an agent that cannot update itself and for one whose update did not go through
const manualBoxes=o=>[
  cmdBox('Linux, installed with the install command',`curl -fsSL ${o}/install/agent.sh | sudo sh -s -- --update`,'Keeps its settings and needs no key.'),
  cmdBox('Docker container (see the name with: docker ps --format "{{.Names}}" | grep lumen-agent)','docker restart lumen-agent','The container downloads the new version when it starts. Use the name of your container if it is not lumen-agent.'),
  el('p',{class:'help'},'Windows: run the install command again (Add a machine, Windows).')];
function updateFailedDialog(h,after,mins){
  const name=h.display_name||h.name,o=location.origin;
  dialog('The update on '+name+' did not go through',el('div',{},
    el('p',{},'It was asked for '+mins+' minutes ago and the agent still reports '+h.version+', not '+S.me.version+'. Do it by hand on the machine:'),
    manualBoxes(o),
    el('h3',{style:'margin:14px 0 4px'},'To see why it failed'),
    cmdBox('Linux','sudo journalctl -u lumen-agent-update -u lumen-agent -n 60 --no-pager','The update helper logs there: a failed download, a checksum that did not match, or a new version that did not stay up (it then rolls back).'),
    cmdBox('Docker','docker logs lumen-agent --tail 60','Look for a download error or a version mismatch.'),
    el('p',{class:'help'},'An update is tried at most once an hour, so that a failing one does not restart the agent in a loop. After the command above, the label goes away when the agent reports the new version.')),
    [['Try again from here',async()=>{try{await api('/api/v1/hosts/'+encodeURIComponent(h.name)+'/update',{},{method:'POST',body:{}});after()}catch(e){throw new Error(e.message)}}],['Close',()=>{},'ghost']])}
async function doUpdate(h,after){
  const name=h.display_name||h.name;
  if(h.self_update){
    if(!confirm('Update the agent on '+name+' from '+h.version+' to '+S.me.version+'?\n\nIt downloads the new version from this server, checks it, and restarts. Monitoring of this machine pauses for a few seconds.'))return;
    try{await api('/api/v1/hosts/'+encodeURIComponent(h.name)+'/update',{},{method:'POST',body:{}});after()}catch(e){alert(e.message)}
    return}
  const o=location.origin;
  dialog('Update the agent on '+name,el('div',{},
    el('p',{},'This agent cannot update itself: it was installed before one-click updates, or it runs on Windows. Update it by hand this once; after that a click is enough (except on Windows).'),
    manualBoxes(o)),
    [['Close',()=>{},'ghost']])}
const can=(a,w)=>{const l=(S.me&&S.me.perms&&S.me.perms[a])||'none';return w?l==='write':l==='read'||l==='write'};
const win=()=>{let to=Date.now(),from=to-(RANGES[S.range]||36e5);if(S.range==='custom'&&S.custom){from=S.custom.from;to=S.custom.to}return{from:new Date(from).toISOString(),to:new Date(to).toISOString(),fromMs:from,toMs:to}};
function clearTimers(){S.timers.forEach(clearInterval);S.timers=[]}

// ---- API ----
let onUnauth=()=>{};
async function api(path,params,opt){
  const u=new URL(path,location.origin);
  if(S.archive&&!(opt&&opt.method)&&/^\/api\/v1\/(traces|logs|series|metrics\/|services|facets)/.test(path))params=Object.assign({},params,{archive:'1'});
  for(const[k,v]of Object.entries(params||{}))for(const x of [].concat(v))if(x!==''&&x!=null&&x!==undefined)u.searchParams.append(k,x);

  if(!r.ok){let m='';try{m=(await r.json()).error}catch{}
    const e=new Error(m||(r.status>=500?'Server error ('+r.status+'). Check the server log: docker compose -f deploy/docker-compose.yml logs lumen':'Request failed ('+r.status+')'));e.status=r.status;throw e}
  return r.json();

const rows=async(p,q)=>(await api(p,q)).data||[];

// ---- formatting ----
const trim=n=>String(+n.toFixed(n>=100?0:n>=10?1:2));
function fmtVal(v,unit){
  if(v==null||isNaN(v))return '–';
  const a=Math.abs(v);

    case 'bytes':{const u=['B','KB','MB','GB','TB','PB'];let i=0,x=v;while(Math.abs(x)>=1024&&i<5){x/=1024;i++}return trim(x)+' '+u[i]}
    case 'bytesps':{const u=['B/s','KB/s','MB/s','GB/s','TB/s'];let i=0,x=v;while(Math.abs(x)>=1024&&i<4){x/=1024;i++}return trim(x)+' '+u[i]}
    case 'uptime':{const d=Math.floor(v/86400),h=Math.floor(v%86400/3600),m=Math.floor(v%3600/60);return d>0?d+'d '+h+'h':h>0?h+'h '+m+'m':m+'m'}

    case 'percent01':return trim(v*100)+'%';
    case 'seconds':return a>=1?trim(v)+' s':a>=1e-3?trim(v*1e3)+' ms':trim(v*1e6)+' µs';
    case 'ms':return a>=1000?trim(v/1000)+' s':trim(v)+' ms';

const pad=n=>String(n).padStart(2,'0');
function fmtTime(ms,spanMs){const d=new Date(ms);return spanMs>=864e5?pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()):pad(d.getHours())+':'+pad(d.getMinutes())+(spanMs<9e5?':'+pad(d.getSeconds()):'')}

const tsMs=t=>Date.parse(String(t).slice(0,23).replace(' ','T')+'Z');

// ---- charts (own SVG renderer: no libraries, no network) ----
const PALETTE=['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#ec4899','#84cc16','#f97316','#14b8a6','#64748b','#eab308'];
function niceTicks(min,max,n){if(!(max>min))max=min+1;const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),nm=raw/mag,st=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;
  const out=[];for(let v=Math.floor(min/st)*st;out.length<12;v+=st){out.push(+v.toFixed(10));if(v>=max-st*1e-9)break} // the top tick is never below the data: otherwise the line is drawn outside the chart and disappears
  return out}
const seriesLabel=(s,fallback)=>{const v=Object.values(s.labels||{}).filter(Boolean);return v.length?v.join(' · '):(fallback||'value')};

function drawChart(box,o){
  const {series=[],type='line',unit='none',fromMs,toMs,step=60,height=220,fallback=''}=o,hidden=o._hidden||(o._hidden=new Set());
  box.replaceChildren();
  const vis=series.map((s,i)=>({s,i,label:seriesLabel(s,fallback),color:PALETTE[i%PALETTE.length]}));
  if(!vis.some(x=>x.s.points.length)){box.append(el('div',{class:'empty'},'No data in this time range'));return}
  const W=Math.max(box.clientWidth||640,260),H=height,R=12,T=8,B=22,ph=H-T-B,span=toMs-fromMs,stepMs=step*1000;
  const act=vis.filter(x=>!hidden.has(x.i));
  const stacked=type==='bar';
  let ymax=0,ymin=0;
  if(stacked){const sums=new Map();act.forEach(x=>x.s.points.forEach(p=>sums.set(p[0],(sums.get(p[0])||0)+p[1])));ymax=Math.max(0,...sums.values())}
  else act.forEach(x=>x.s.points.forEach(p=>{ymax=Math.max(ymax,p[1]);ymin=Math.min(ymin,p[1])}));
  if(unit==='percent01'&&ymax<=1)ymax=Math.max(ymax,1);if(unit==='percent'&&ymax<=100&&ymax>50)ymax=100;
  const yt=niceTicks(ymin,ymax*1.04||1,4),y0=yt[0],y1=yt[yt.length-1];
  const L=Math.max(58,Math.ceil(Math.max(...yt.map(v=>fmtVal(v,unit).length))*6.4)+14),pw=W-L-R; // room for the widest axis label ("57.2 MB/s")
  const X=t=>L+(t-fromMs)/span*pw,Y=v=>T+ph-(v-y0)/(y1-y0||1)*ph;
  const root=svg('svg',{viewBox:`0 0 ${W} ${H}`,height:H,role:'img'});
  yt.forEach(v=>{root.append(svg('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:'var(--line)'}),svg('text',{x:L-6,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:'var(--mut)'},fmtVal(v,unit)))});
  for(let i=0;i<=5;i++){const t=fromMs+span*i/5;root.append(svg('text',{x:X(t),y:H-6,'text-anchor':i===0?'start':i===5?'end':'middle','font-size':11,fill:'var(--mut)'},fmtTime(t,span)))}
  const base=Y(Math.max(y0,0));
  if(stacked){
    const bw=Math.max(1,Math.min(pw*stepMs/span*.8,40)),acc=new Map();
    act.forEach(x=>{x.s.points.forEach(p=>{const b=acc.get(p[0])||0,h=Math.max(0,(p[1])/(y1-y0)*ph);acc.set(p[0],b+p[1]);
      root.append(svg('rect',{x:X(p[0])-bw/2,y:Y(b+p[1]),width:bw,height:h,fill:x.color,opacity:.9}))})});
  }else act.forEach(x=>{
    const pts=x.s.points;if(!pts.length)return;let d='',a='';
    pts.forEach((p,i)=>{const gap=i>0&&p[0]-pts[i-1][0]>Math.max(stepMs*2.5,1);const cmd=(i===0||gap)?'M':'L';
      if(gap&&type==='area')a+=`L${X(pts[i-1][0])},${base}Z`;if((i===0||gap)&&type==='area')a+=`M${X(p[0])},${base}L${X(p[0])},${Y(p[1])}`;else if(type==='area')a+=`L${X(p[0])},${Y(p[1])}`;
      d+=`${cmd}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`});
    if(type==='area')root.append(svg('path',{d:a+`L${X(pts[pts.length-1][0])},${base}Z`,fill:x.color,opacity:.16}));
    root.append(svg('path',{d,fill:'none',stroke:x.color,'stroke-width':1.8,'stroke-linejoin':'round'}));
    if(pts.length===1)root.append(svg('circle',{cx:X(pts[0][0]),cy:Y(pts[0][1]),r:3,fill:x.color}));
  });
  const cross=svg('line',{y1:T,y2:T+ph,stroke:'var(--mut)','stroke-dasharray':'3 3',opacity:0}),hit=svg('rect',{x:L,y:T,width:pw,height:ph,fill:'transparent'});
  root.append(cross,hit);
  const tip=el('div',{class:'tip'});
  const near=(pts,t)=>{let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;pts[m][0]<t?lo=m:hi=m}return Math.abs(pts[lo][0]-t)<=Math.abs(pts[hi][0]-t)?pts[lo]:pts[hi]};
  hit.addEventListener('mousemove',e=>{const r=root.getBoundingClientRect(),px=(e.clientX-r.left)*(W/(r.width||W)),t=fromMs+(px-L)/pw*span;
    const rowsT=act.filter(x=>x.s.points.length).map(x=>({x,p:near(x.s.points,t)}));if(!rowsT.length)return;
    const t0=rowsT[0].p[0];cross.setAttribute('x1',X(t0));cross.setAttribute('x2',X(t0));cross.setAttribute('opacity',1);
    tip.replaceChildren(el('b',{},new Date(t0).toLocaleString()),...rowsT.map(({x,p})=>el('div',{},el('i',{style:'background:'+x.color}),x.label+': ',el('b',{style:'display:inline'},fmtVal(p[1],unit)))));
    tip.style.display='block';const left=X(t0)/W*r.width+12;tip.style.left=(left>r.width-190?left-200:left)+'px';tip.style.top='8px'});
  hit.addEventListener('mouseleave',()=>{tip.style.display='none';cross.setAttribute('opacity',0)});
  const legend=el('div',{class:'legend'},vis.length>1||vis[0].label!=='value'?vis.map(x=>el('span',{class:hidden.has(x.i)?'off':'',title:'Click to hide or show',onclick:()=>{hidden.has(x.i)?hidden.delete(x.i):hidden.add(x.i);drawChart(box,o)}},el('i',{style:'background:'+x.color}),x.label)):[]);
  box.append(root,tip,legend);
}
function chartBox(o){const box=el('div',{class:'chart'});o.box=box;
  const draw=()=>drawChart(box,o);requestAnimationFrame(draw);
  if(window.ResizeObserver){let last=0;new ResizeObserver(()=>{const w=box.clientWidth;if(w&&Math.abs(w-last)>8){last=w;draw()}}).observe(box)}
  return box}
const lastV=s=>s.points.length?s.points[s.points.length-1][1]:null;

function spark(points,w=110,h=34){if(points.length<2)return null;const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(...ys)||1;
  const d=points.map((p,i)=>`${i?'L':'M'}${((p[0]-x0)/(x1-x0||1)*w).toFixed(1)},${(h-(p[1]-y0)/(y1-y0||1)*(h-4)-2).toFixed(1)}`).join('');
  return svg('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h},svg('path',{d,fill:'none',stroke:'var(--acc)','stroke-width':1.6}))}
// ---- panels ----
const PANEL_TYPES={line:'Line chart',area:'Area chart',bar:'Bar chart (stacked)',stat:'Single value',table:'Table of series',logs:'Log lines',traces:'Trace list'};
const UNITS={none:'Number',bytes:'Bytes',bytesps:'Bytes per second',percent:'Percent (0-100)',percent01:'Percent (0-1)',seconds:'Seconds',uptime:'Duration (d h m)',ms:'Milliseconds',rate:'Per second'};
const HEIGHTS={1:150,2:240,3:340};
// Status panels (up/down counts) do not depend on the time range: they show the situation right now.
const STATUS_KINDS={alerts_firing:['Alerts firing','#/alerts'],nc_down:['Nextcloud instances DOWN','#/instances'],nc_up:['Nextcloud instances up','#/instances'],host_down:['Hosts DOWN','#/hosts'],host_up:['Hosts up','#/hosts'],svc_down:['Services DOWN','#/hosts'],svc_up:['Services up','#/hosts'],container_down:['Containers DOWN','#/hosts'],container_up:['Containers up','#/hosts']};
function statusValue(s,k){
  if(k==='alerts_firing'){const a=s.alerts||{firing:0,pending:0};return{n:a.firing,total:0,cls:a.firing>0?'err':'ok',names:a.pending?[a.pending+' pending']:[],label:'Alerts firing'}}
  const kind=k.split('_')[0],isDown=k.endsWith('_down');
  const cnt=({nc:s.nextcloud,host:s.hosts,svc:s.services,container:s.containers})[kind]||{up:0,down:0};
  let names=[];
  if(isDown){
    if(kind==='nc')names=(s.instances||[]).filter(i=>i.status==='down').map(i=>i.name+(i.reason?' – '+i.reason:''));
    else if(kind==='host')names=(s.host_list||[]).filter(h=>h.status==='down').map(h=>h.name);
    else names=(s.down||[]).filter(d=>d.kind===(kind==='svc'?'service':'container')).map(d=>d.host+': '+d.name+(d.state?' ('+d.state+')':''))}
  const n=isDown?cnt.down:cnt.up;
  return{n,total:cnt.up+cnt.down,cls:isDown?(n>0?'err':'ok'):(n>0?'ok':'mut'),names,label:(STATUS_KINDS[k]||STATUS_KINDS.nc_down)[0]}}
const newPanel=(title,type,w,h,q,unit)=>({id:uid(),title,type,w,h,q,unit:unit||'none'});
const isSeriesType=t=>['line','area','bar','stat','table'].includes(t);

function seriesParams(q,w,stepHint){
  const p={from:w.from,to:w.to,service:q.service||'',host:q.host||'',group:q.group||'',group_by:q.groupBy||'',step:stepHint||''};
  if(q.src==='metric'){p.source='metric';p.name=q.name;p.agg=q.agg||'avg';p.filter=(q.filters||[]).filter(f=>f.k&&f.v!=='').map(f=>f.k+':'+f.v)}
  else if(q.src==='traces'){p.source='traces';p.metric=q.metric||'requests'}
  else{p.source='logs';p.severity=q.severity||'';p.q=q.text||''}
  return p}

async function loadPanel(p,body,w){
  body.replaceChildren(el('div',{class:'empty mut'},'Loading…'));
  try{
    const q=p.q||{},h=HEIGHTS[p.h]||240;
    if(q.src==='status'){
      const k=STATUS_KINDS[q.status]?q.status:'nc_down',s=await api('/api/v1/status'),d=statusValue(s,k);
      const pend=k.startsWith('nc_')?(s.instances||[]).filter(i=>i.status==='pending').length:0;
      body.replaceChildren(el('div',{class:'stat click',title:'Open details',onclick:()=>{location.hash=STATUS_KINDS[k][1]}},el('div',{},el('div',{class:'v '+d.cls},String(d.n)),
        el('div',{class:'l'},d.label+(d.total?' (of '+d.total+')':'')+(pend?' · '+pend+' starting':'')),
        d.names.length?el('div',{class:'names'},d.names.slice(0,4).join('\n')+(d.names.length>4?'\n+'+(d.names.length-4)+' more':'')):null)));return}
    if(p.type==='logs'){
      const r=await rows('/api/v1/logs',{from:w.from,to:w.to,service:q.service||'',host:q.host||'',severity:q.severity||'',q:q.text||'',limit:100});
      body.replaceChildren(r.length?el('div',{class:'loglines'},r.map(l=>el('div',{},el('span',{class:'mut'},String(l.ts).slice(11,19)+' '),el('span',{class:'lvl '+l.severity},l.severity),' ',el('span',{class:'mut'},l.service+' '),l.body))):el('div',{class:'empty'},'No log lines'));return}
    if(p.type==='traces'){
      const r=await rows('/api/v1/traces',{from:w.from,to:w.to,service:q.service||'',errors:q.errorsOnly?'true':'',min_duration_ms:q.minMs||'',limit:25});
      body.replaceChildren(r.length?el('table',{},el('tr',{},['Start','Root span','Service','Duration'].map(x=>el('th',{},x))),
        r.map(t=>el('tr',{class:'row',onclick:()=>location.hash='#/t/'+t.trace_id},el('td',{class:'mut'},String(t.start_time).slice(11,19)),el('td',{class:t.has_error?'err':''},t.root_name),el('td',{},t.root_service),el('td',{},fmtD(t.duration_ns))))):el('div',{class:'empty'},'No traces'));return}
    if(p.q.src==='metric'&&!p.q.name){body.replaceChildren(el('div',{class:'empty'},'Choose a metric (edit this panel)'));return}
    const r=await api('/api/v1/series',seriesParams(q,w));
    const series=r.data||[],step=r.step||60;
    if(p.type==='stat'){
      const items=series.map(s=>({l:seriesLabel(s,''),v:lastV(s),s}));
      if(!items.length||items.every(i=>i.v==null)){body.replaceChildren(el('div',{class:'empty'},'No data'));return}
      body.replaceChildren(el('div',{class:'stat'},items.slice(0,6).map(i=>el('div',{},el('div',{class:'v'},fmtVal(i.v,p.unit)),el('div',{class:'l'},i.l||p.title),items.length===1?spark(i.s.points):null))));return}
    if(p.type==='table'){
      body.replaceChildren(series.length?el('table',{},el('tr',{},['Series','Last','Average','Max'].map(x=>el('th',{},x))),series.map(s=>{const v=s.points.map(x=>x[1]);
        return el('tr',{},el('td',{},seriesLabel(s,p.title)),el('td',{},fmtVal(lastV(s),p.unit)),el('td',{},fmtVal(v.reduce((a,b)=>a+b,0)/(v.length||1),p.unit)),el('td',{},fmtVal(Math.max(...v),p.unit)))})):el('div',{class:'empty'},'No data'));return}
    const box=chartBox({series,type:p.type,unit:p.unit,fromMs:w.fromMs,toMs:w.toMs,step,height:h-44,fallback:p.q.name||p.title});
    body.replaceChildren(box);
  }catch(e){body.replaceChildren(el('div',{class:'err',style:'padding:10px'},e.message))}
}

async function dashboardPage(id){
  const view=$('#view');let D;
  try{D=await api('/api/v1/dashboards/'+encodeURIComponent(id))}catch(e){view.replaceChildren(el('div',{class:'msg'},e.status===404?'This dashboard does not exist (anymore).':e.message),el('a',{href:'#/dashboards'},'← All dashboards'));return}
  let panels=(D.body&&D.body.panels)||[],editing=false,name=D.name,desc=D.description||'',dirty=false;
  setTitle(name);
  const draw=()=>{
    clearTimers();setTitle(name);
    const msg=el('div',{id:'dmsg'});
    const bar=el('div',{class:'bar'},
      editing?el('input',{id:'dname',value:name,size:28,oninput:e=>{name=e.target.value;dirty=true}}):el('span',{class:'mut'},desc),
      el('span',{class:'sp'}),
      editing?[el('button',{class:'btn ghost',onclick:()=>openEditor(null)},'+ Add panel'),
        el('button',{class:'btn',onclick:save},'Save'),
        el('button',{class:'btn ghost',onclick:()=>{if(!dirty||confirm('Discard your changes?'))dashboardPage(id)}},'Cancel'),
        el('button',{class:'btn danger',onclick:del},'Delete')]
      :[can('dashboards',true)?el('button',{class:'btn ghost',onclick:()=>{editing=true;draw()}},'Edit dashboard'):null]);
    const grid=el('div',{class:'grid'});
    if(!panels.length)grid.append(el('div',{class:'card empty',style:'grid-column:span 12'},editing?'No panels yet. Click “+ Add panel”.':'This dashboard is empty.'+(can('dashboards',true)?' Click “Edit dashboard” to add panels.':'')));
    const w=win(),bodies=[];
    panels.forEach((p,i)=>{
      const body=el('div',{class:'body',style:'min-height:'+((HEIGHTS[p.h]||240)-34)+'px'});bodies.push([p,body]);
      const card=el('div',{class:'panel'+(editing?' edit':''),style:'--w:'+(p.w||6),draggable:editing?'true':null,
        ondragstart:e=>{e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'},
        ondragover:e=>{if(editing){e.preventDefault();card.classList.add('over')}},ondragleave:()=>card.classList.remove('over'),
        ondrop:e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain');if(from!==i&&panels[from]){panels.splice(i,0,panels.splice(from,1)[0]);dirty=true;draw()}}},
        el('header',{},el('span',{class:'t',title:p.title},p.title),editing?[
          el('button',{title:'Edit panel',onclick:()=>openEditor(i)},'⚙'),
          el('button',{title:'Duplicate',onclick:()=>{panels.splice(i+1,0,Object.assign(JSON.parse(JSON.stringify(p)),{id:uid(),title:p.title+' (copy)'}));dirty=true;draw()}},'⧉'),
          el('button',{title:'Remove',onclick:()=>{panels.splice(i,1);dirty=true;draw()}},'✕')]:null),body);
      grid.append(card)});
    $('#view').replaceChildren(msg,bar,grid);
    bodies.forEach(([p,b])=>loadPanel(p,b,w));
    if(S.refresh&&!editing)S.timers.push(setInterval(()=>{const w2=win();bodies.forEach(([p,b])=>{if(b.isConnected)loadPanel(p,b,w2)})},S.refresh*1000));
  };
  const note=(t,cls)=>{const m=$('#dmsg');if(m)m.replaceChildren(el('div',{class:'msg '+(cls||'')},t))};
  async function save(){
    try{D=await api('/api/v1/dashboards/'+id,{},{method:'PUT',body:{name,description:desc,body:{panels},version:D.version}});panels=D.body.panels||[];dirty=false;editing=false;draw();note('Saved.','info')}
    catch(e){note(e.status===409?'Someone else changed this dashboard. Cancel to reload it, then apply your change again.':e.message)}}
  async function del(){if(!confirm('Delete this dashboard permanently?'))return;try{await api('/api/v1/dashboards/'+id,{},{method:'DELETE'});location.hash='#/dashboards'}catch(e){note(e.message)}}
  function openEditor(i){panelEditor(i==null?null:panels[i],p=>{if(i==null)panels.push(p);else panels[i]=p;dirty=true;draw()})}
  draw();
  S.onRangeChange=()=>draw();
}

async function panelEditor(existing,onSave){
